<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">Acee. Small tools. Dependable by design.</title>
  <desc id="desc">A dark developer-tools banner with a terminal illustration.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="958" height="222" rx="16" fill="#0d1117" stroke="#30363d"/>
  <path d="M576 1h367a16 16 0 0 1 16 16v190a16 16 0 0 1-16 16H576Z" fill="url(#grid)"/>
  <rect x="48" y="40" width="4" height="14" rx="2" fill="#7ee7c0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="51" font-size="12" font-weight="700" letter-spacing="2" fill="#8b949e">0xacee / DEVELOPER TOOLS</text>
    <text x="44" y="116" font-size="64" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Acee<tspan fill="#7ee7c0">.</tspan></text>
    <text x="48" y="151" font-size="20" fill="#c9d1d9">Small tools. Dependable by design.</text>
    <text x="48" y="189" font-size="12" letter-spacing="0.4" fill="#8b949e">CLI contracts<tspan fill="#484f58">  /  </tspan>config drift<tspan fill="#484f58">  /  </tspan>identity isolation</text>
  </g>
  <rect x="632" y="40" width="280" height="144" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M632 70h280" stroke="#30363d"/>
  <circle cx="649" cy="55" r="3" fill="#484f58"/>
  <circle cx="661" cy="55" r="3" fill="#484f58"/>
  <circle cx="673" cy="55" r="3" fill="#7ee7c0"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="894" y="59" font-size="11" text-anchor="end" fill="#8b949e">~/tools</text>
    <text x="650" y="101" font-size="13" fill="#c9d1d9"><tspan fill="#7ee7c0">$ </tspan>build small</text>
    <text x="650" y="127" font-size="13" fill="#c9d1d9"><tspan fill="#7ee7c0">$ </tspan>test the edges</text>
    <text x="650" y="153" font-size="13" fill="#c9d1d9"><tspan fill="#7ee7c0">$ </tspan>fix real bugs</text>
  </g>
  <rect x="770" y="142" width="7" height="14" rx="1" fill="#7ee7c0"/>
